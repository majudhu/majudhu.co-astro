version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare --activate pnpm@12.5.1
        - pnpm config set store-dir .pnpm-store
        - pnpm install
    build:
      commands:
        - pnpm build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .pnpm-store
